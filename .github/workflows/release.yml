name: Release Chrome Extension

on:
  push:
    tags:
      - 'v*.*.*'

# Add permissions for GitHub release creation
permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      # @Reference: https://zenn.dev/link/comments/ab5ad0d93dac67
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Security audit
        run: pnpm audit

      - name: Clean dist directory
        run: rm -rf dist

      - name: Code quality checks
        run: |
          pnpm run prettier-check
          pnpm run eslint-check
          pnpm run type-check

      - name: Build extension
        run: pnpm run build

      - name: Package extension
        run: |
          # Check if dist/prod directory exists
          if [ ! -d "dist/prod" ]; then
            echo "::error::dist/prod directory not found. Please run build first."
            exit 1
          fi

          # Remove existing zip file
          rm -f tag-extension-manager-*.zip

          # Create ZIP file
          cd dist/prod
          zip -r "../../tag-extension-manager-${{ env.VERSION }}.zip" .
          cd ../..

          echo "Successfully created tag-extension-manager-${{ env.VERSION }}.zip"

          # Verify the file was created
          ls -la tag-extension-manager-*.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: extension-build
          path: tag-extension-manager-*.zip

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          files: tag-extension-manager-*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Chrome Web Store
        id: cws_upload
        # Chrome Web Store API v2 (the previous API version shuts down on 2026-10-15)
        run: bash .github/scripts/chrome-webstore.sh publish "tag-extension-manager-${{ env.VERSION }}.zip"
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        continue-on-error: true

      - name: Check Chrome Web Store upload result
        if: always()
        run: |
          if [ "${{ steps.cws_upload.outcome }}" == "success" ]; then
            echo "✅ Chrome Web Store submission completed — the new version goes live when the review passes"
            echo "   Confirm the Version field on the store listing afterwards"
          else
            echo "⚠️ Chrome Web Store upload failed"
            echo ""
            echo "🔍 Troubleshooting:"
            echo ""
            echo "1. Read the error printed by the upload step; it names the failing request"
            echo "   (OAuth2 token, fetchStatus, upload or publish) and the likely cause"
            echo ""
            echo "2. Check the credentials without releasing: run the 'Chrome Web Store Check'"
            echo "   workflow (Actions > Chrome Web Store Check > Run workflow)"
            echo ""
            echo "3. Repository secrets (Settings > Secrets and variables > Actions):"
            echo "   - CHROME_PUBLISHER_ID: Developer Dashboard > Publisher > Settings"
            echo "   - CHROME_EXTENSION_ID: the item's URL in the Developer Dashboard"
            echo "   - CHROME_CLIENT_ID / CHROME_CLIENT_SECRET: a 'Desktop app' OAuth client in"
            echo "     Google Cloud Console > APIs & Services > Credentials, in a project with the"
            echo "     Chrome Web Store API enabled"
            echo "   - CHROME_REFRESH_TOKEN: expires after 6 months unused (7 days while the OAuth"
            echo "     consent screen is in 'Testing'). Re-issue it with 'npx chrome-webstore-upload-keys'"
            echo "     (OAuth2 Playground fails with redirect_uri_mismatch for Desktop clients)"
            echo ""
            echo "4. To publish this version by hand, upload tag-extension-manager-${{ env.VERSION }}.zip"
            echo "   from the GitHub Release in the Developer Dashboard:"
            echo "   https://chrome.google.com/webstore/devconsole/"
            echo ""
            echo "5. API reference: https://developer.chrome.com/docs/webstore/api/reference/rest"

            # Fail the workflow so a missed upload is visible; the GitHub
            # Release itself is already created in an earlier step.
            exit 1
          fi
